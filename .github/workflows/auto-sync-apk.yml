# Keeps this fork's fork-only chip overrides alive across upstream updates and
# builds a fresh arm64 APK at most once every 72 hours.
#
# Upstream ships the stock island labels; every merge would otherwise bring them
# back. tooling/ci-patch-live-chip.py re-applies them, then the usual build runs.
name: Auto sync and build APK

on:
  schedule:
    # Every six hours so the 72-hour gate lands within a few hours of the mark.
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build now even if the last build was under 72 hours ago"
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-sync-apk
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.7
  TZ: Asia/Shanghai
  DSH_BETA_TOKEN_FILE: ""

jobs:
  sync-build:
    name: sync upstream, patch chips, build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout ci-apk
        uses: actions/checkout@v4
        with:
          ref: ci-apk
          fetch-depth: 0

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream and re-apply chip overrides
        id: sync
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          git remote add upstream https://github.com/ccch1mneyyy/dsh-Go.git 2>/dev/null || true
          git fetch --depth=50 upstream main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "upstream already merged"
          else
            git merge --no-edit -X theirs FETCH_HEAD
          fi
          python3 tooling/ci-patch-live-chip.py
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(ci): sync upstream and re-apply the island chip overrides"
            git push origin HEAD:ci-apk
          fi
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi
          git rev-parse --short HEAD

      - name: Decide whether to build
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force || 'false' }}
          CHANGED: ${{ steps.sync.outputs.changed }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request

          out = os.environ['GITHUB_OUTPUT']

          def decide(build, why):
              with open(out, 'a', encoding='utf-8') as handle:
                  handle.write('build=' + build + '\n')
              print(why)

          if os.environ.get('FORCE') == 'true':
              decide('yes', 'forced by the manual trigger')
              raise SystemExit
          if os.environ.get('CHANGED') == 'yes':
              decide('yes', 'upstream moved')
              raise SystemExit

          url = ('https://api.github.com/repos/' + os.environ['REPO']
                 + '/actions/workflows/auto-sync-apk.yml/runs?per_page=20')
          req = urllib.request.Request(url, headers={
              'Authorization': 'token ' + os.environ['GH_TOKEN'],
              'Accept': 'application/vnd.github+json',
          })
          runs = json.load(urllib.request.urlopen(req, timeout=30))['workflow_runs']
          last = next((r['created_at'] for r in runs if r['conclusion'] == 'success'), None)
          if last is None:
              decide('yes', 'no previous build')
              raise SystemExit
          age = time.time() - time.mktime(time.strptime(last, '%Y-%m-%dT%H:%M:%SZ'))
          decide('yes' if age >= 72 * 3600 else 'no', 'last build %.1fh ago' % (age / 3600))
          PY

      - name: Host tools
        if: steps.gate.outputs.build == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gpgv zstd file unzip xz-utils

      - name: JDK 17
        if: steps.gate.outputs.build == 'yes'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter ${{ env.FLUTTER_VERSION }}
        if: steps.gate.outputs.build == 'yes'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Android SDK setup
        if: steps.gate.outputs.build == 'yes'
        uses: android-actions/setup-android@v3
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Android SDK packages
        if: steps.gate.outputs.build == 'yes'
        run: |
          set -euo pipefail
          sdkm=$(command -v sdkmanager || true)
          if [ -z "$sdkm" ]; then
            sdkm=$(find /usr/local/lib/android "$HOME" -maxdepth 6 -type f -name sdkmanager 2>/dev/null | head -1)
          fi
          test -n "$sdkm"
          ext=$(find "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main" -name 'FlutterExtension.*' -print -quit)
          ndk=$(grep -oE 'ndkVersion[^"]*"[0-9.]+"' "$ext" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          sdk=$(grep -oE 'compileSdkVersion[^0-9]*[0-9]+' "$ext" | grep -oE '[0-9]+$' | head -1)
          yes | "$sdkm" --licenses >/dev/null 2>&1 || true
          "$sdkm" "platform-tools" "platforms;android-$sdk" "build-tools;$sdk.0.0" "ndk;$ndk" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"

      - name: Cache runtime downloads
        if: steps.gate.outputs.build == 'yes'
        uses: actions/cache@v4
        with:
          path: |
            runtime/.cache
            runtime/out
          key: runtime-arm64-${{ hashFiles('runtime/build-runtime.sh', 'runtime/locks/**') }}
          restore-keys: |
            runtime-arm64-

      - name: Generate l10n
        if: steps.gate.outputs.build == 'yes'
        run: python3 app/tool/l10n_merge.py

      - name: Flutter packages
        if: steps.gate.outputs.build == 'yes'
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Runtime bundle (arm64-v8a)
        if: steps.gate.outputs.build == 'yes'
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        if: steps.gate.outputs.build == 'yes'
        run: |
          set -euo pipefail
          base=$(sed -nE 's/^version:[[:space:]]*([0-9][0-9.]*).*/\1/p' app/pubspec.yaml | head -1)
          name="${base:-0.0.0}-ci.${GITHUB_SHA::8}"
          bash tooling/build-apk.sh -f arm64 --no-companion --build-name "$name"

      - name: Collect APK
        if: steps.gate.outputs.build == 'yes'
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-arm64-release.apk
          test -f "$apk"
          mkdir -p out
          cp "$apk" "out/dsh-go-${GITHUB_SHA::8}-arm64.apk"
          ( cd out && sha256sum ./*.apk > SHA256SUMS )
          cat out/SHA256SUMS

      - name: Upload APK
        if: steps.gate.outputs.build == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-auto-${{ github.sha }}
          path: |
            out/*.apk
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
